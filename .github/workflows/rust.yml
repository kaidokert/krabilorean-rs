name: Rust

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read


concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - uses: pre-commit/action@v3.0.1

  krabilorean:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Clippy
      run: cargo clippy --manifest-path=krabilorean/Cargo.toml --all-targets -- -D warnings
    - name: Build
      run: cargo build --manifest-path=krabilorean/Cargo.toml --verbose
    - name: Test
      run: cargo test --manifest-path=krabilorean/Cargo.toml
