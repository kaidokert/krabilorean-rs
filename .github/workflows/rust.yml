name: Rust

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read


concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - uses: pre-commit/action@v3.0.1

  krabilorean:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - "1.93.0"
          - stable
          - nightly
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.toolchain }}
    - name: Clippy
      run: |
        cargo clippy --manifest-path=krabilorean/Cargo.toml --all-targets -- -D warnings
        if [ "${{ matrix.toolchain }}" = "nightly" ]; then
          cargo clippy --manifest-path=krabilorean/Cargo.toml --all-targets --all-features -- -D warnings
        fi
    - name: Build
      run: |
        cargo build --manifest-path=krabilorean/Cargo.toml --verbose
        if [ "${{ matrix.toolchain }}" = "nightly" ]; then
          cargo build --manifest-path=krabilorean/Cargo.toml --all-features --verbose
        fi
    - name: Test
      run: |
        cargo test --manifest-path=krabilorean/Cargo.toml
        if [ "${{ matrix.toolchain }}" = "nightly" ]; then
          cargo test --manifest-path=krabilorean/Cargo.toml --all-features
        fi
