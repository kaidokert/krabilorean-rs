repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  -   id: trailing-whitespace
  -   id: end-of-file-fixer
  -   id: check-added-large-files
  -   id: check-merge-conflict
  -   id: check-yaml
  -   id: check-toml
  -   id: mixed-line-ending
      args: ["--fix=lf"]

- repo: https://github.com/doublify/pre-commit-rust
  rev: v1.0
  hooks:
  -   id: fmt
      name: Fmt for krabilorean
      args: ['--manifest-path=krabilorean/Cargo.toml', '--']

- repo: local
  hooks:
  -   id: krabilorean-clippy
      name: clippy krabilorean
      entry: cargo clippy --manifest-path=krabilorean/Cargo.toml --all-targets -- -D warnings
      language: system
      pass_filenames: false
      files: ^krabilorean/.*\.(rs|toml)$
